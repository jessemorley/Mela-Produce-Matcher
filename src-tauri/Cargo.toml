[package]
name = "recipe-suggester"
version = "0.3.1"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "recipe_suggester_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
ureq = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tauri-plugin-updater = "2.10.1"

[dev-dependencies]
# Cover photos are copied out of Mela byte-for-byte now, so nothing decodes
# or re-encodes images at runtime — this is only here to synthesise sample
# files for the format-sniffing test.
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "tiff"] }

