<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- App icon: the sidebar mark (lucide Sprout in the palette's match green,
       on a rounded square) at icon scale. The sidebar draws it at 18px inside
       a 32px tile; that ratio leaves too much air once macOS adds its own
       padding, so the glyph is proportionally larger here, and the tile is
       opaque pane rather than the sidebar's match/14 tint, which only reads
       with a pane behind it.
       Scale is the glyph's span in the 1024 tile: 38 puts it at ~68%, close
       to the ~80% artwork area macOS's icon grid gives a full-bleed mark.
       An earlier 30.5 (~54%) read small in the Dock beside solid-form icons
       like Photoshop's.
       Regenerate the raster set with: npx tauri icon src-tauri/icons/icon.svg -->
  <rect width="1024" height="1024" rx="228" fill="#1b1a18"/>
  <g transform="translate(512 512) scale(38) translate(-12 -12)"
     fill="none" stroke="#9fc08a" stroke-width="1.75"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 9.536V7a4 4 0 0 1 4-4h1.5a.5.5 0 0 1 .5.5V5a4 4 0 0 1-4 4 4 4 0 0 0-4 4c0 2 1 3 1 5a5 5 0 0 1-1 3"/>
    <path d="M4 9a5 5 0 0 1 8 4 5 5 0 0 1-8-4"/>
    <path d="M5 21h14"/>
  </g>
</svg>
