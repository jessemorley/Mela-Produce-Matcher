<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seasonal Recipe Suggester</title>
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <main class="container">
      <h1>What's in season?</h1>

      <form class="row" id="suggest-form">
        <input
          id="feed-url"
          placeholder="Feed URL"
          value="https://www.harrisfarm.com.au/blogs/daves-market-update.atom"
        />
        <button type="submit" id="suggest-btn">Suggest recipes</button>
      </form>

      <p id="status"></p>
      <ol id="results"></ol>
    </main>
  </body>
</html>
